<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>基隆景點瀏覽器</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <h1 class="text-center mb-4">
        基隆景點瀏覽器
    </h1>

    <div class="d-flex flex-wrap gap-2 justify-content-center mb-4">

        <button class="btn btn-primary"
                onclick="loadSights('zhongshan')">
            中山區
        </button>

        <button class="btn btn-primary"
                onclick="loadSights('xinyi')">
            信義區
        </button>

        <button class="btn btn-primary"
                onclick="loadSights('renai')">
            仁愛區
        </button>

        <button class="btn btn-primary"
                onclick="loadSights('zhongzheng')">
            中正區
        </button>

        <button class="btn btn-primary"
                onclick="loadSights('anle')">
            安樂區
        </button>

        <button class="btn btn-primary"
                onclick="loadSights('qidu')">
            七堵區
        </button>

        <button class="btn btn-primary"
                onclick="loadSights('nuannuan')">
            暖暖區
        </button>

    </div>

    <div id="sightList" class="row g-4">

    </div>

</div>


<script>

    function loadSights(zone) {

        fetch("/api/sights/" + zone)

            .then(response => response.json())

            .then(data => {

                const sightList =
                    document.getElementById("sightList");

                sightList.innerHTML = "";

                data.forEach((sight, index) => {

                    const card = `
                    <div class="col-12 col-md-4">

                        <div class="card h-100">

                            <div class="card-body">

                                <h5 class="card-title">
                                    ${sight.sightName}
                                </h5>

                                <p class="card-text">
                                    區域：${sight.zone}
                                </p>

                                <p class="card-text">
                                    分類：${sight.category}
                                </p>

                            </div>

                        </div>

                    </div>
                `;

                    sightList.innerHTML += card;

                });

            })

            .catch(error => {

                console.error("發生錯誤：", error);

            });

    }

</script>


<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
